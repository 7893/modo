<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MODO · 墨斗 // 多云分布式数据底座与智能中枢</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

  <!-- Tailwind CSS & FontAwesome -->
  <style>${tailwindCss}</style>
  <!-- ECharts 5, Supabase JS & FontAwesome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    body {
      background-color: #060911;
      background-image:
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 45%),
        radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(139, 92, 246, 0.06) 0px, transparent 55%);
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
    }

    /* Supabase Curtain Animation */
    .curtain-panel {
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 1.25rem;
    }
    .curtain-expanded {
      flex: 1 1 0%;
      min-width: 0;
      opacity: 1;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.06);
    }
    .curtain-collapsed {
      flex: 0 0 64px;
      cursor: pointer;
      opacity: 0.92;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.06);
      padding: 1.25rem 0.35rem !important;
    }
    .curtain-collapsed:hover {
      opacity: 1;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(16, 185, 129, 0.3);
    }
    .vertical-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 0.22em;
      white-space: nowrap;
    }

    .full-height-table {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .full-height-table table {
      height: 100%;
      width: 100%;
      border-collapse: collapse;
    }
    .full-height-table tbody {
      height: 100%;
      display: table-row-group;
    }
    .full-height-table tbody tr {
      height: calc(100% / 11);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.3); }

    .supabase-light-card {
      background: rgba(13, 19, 33, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .supabase-light-card:hover {
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: 0 8px 30px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-emerald-900 selection:text-emerald-200">

  <!-- TOP NAV BAR (SUPABASE CLEAN WHITE HEADER) -->
  <header class="z-50 border-b border-slate-800/80 bg-[#080D1A]/90 backdrop-blur-xl px-5 py-2.5 flex items-center justify-between shrink-0 shadow-lg">

    <!-- Left: Logo & Nav items -->
    <div class="flex items-center space-x-6">
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="handleCurtainClick('overview')">
        <div class="w-8 h-8 rounded-xl bg-emerald-950/60 border border-emerald-800 flex items-center justify-center text-emerald-400 shadow-sm">
          <svg class="w-4.5 h-4.5 fill-current" viewBox="0 0 24 24">
            <path d="M21.362 9.354H12V.343a.343.343 0 0 0-.583-.245L.15 11.597a.343.343 0 0 0 .245.584h9.362v9.011a.343.343 0 0 0 .583.245l11.267-11.499a.343.343 0 0 0-.245-.584z"/>
          </svg>
        </div>
        <span class="text-base font-bold tracking-tight text-white font-mono flex items-center gap-2">
          <span>MODO</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-950/60 text-emerald-300 border border-emerald-800 font-sans font-semibold">墨斗 · 数据底座</span>
        </span>
      </div>

      <!-- Center Links (Jump to Curtains) -->
      <nav class="hidden xl:flex items-center space-x-1 text-xs text-slate-400 font-medium">
        <button onclick="handleCurtainClick('overview')" class="px-2.5 py-1 rounded-md hover:text-white hover:bg-slate-800/60 transition">总览 Overview</button>
        <button onclick="handleCurtainClick('map')" class="px-2.5 py-1 rounded-md hover:text-white hover:bg-slate-800/60 transition">雷达 Radar</button>
        <button onclick="handleCurtainClick('resource')" class="px-2.5 py-1 rounded-md hover:text-white hover:bg-slate-800/60 transition">算力 Compute</button>
        <button onclick="handleCurtainClick('latency')" class="px-2.5 py-1 rounded-md hover:text-white hover:bg-slate-800/60 transition">时延 Latency</button>
        <button onclick="handleCurtainClick('table')" class="px-2.5 py-1 rounded-md hover:text-white hover:bg-slate-800/60 transition">资产 Inventory</button>
        <button onclick="handleCurtainClick('ai')" class="px-2.5 py-1 rounded-md hover:text-white hover:bg-slate-800/60 transition">AI Engine</button>
      </nav>
    </div>

    <!-- Center Status Badges -->
    <div class="hidden md:flex items-center space-x-5 text-xs font-mono">
      <div class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_#10b981]"></span>
        <span class="text-slate-500">服务状态:</span>
        <span id="fleet-health-badge" class="px-2.5 py-0.5 rounded-full bg-emerald-950/60 text-emerald-300 border border-emerald-800 font-semibold text-[11px]">
          100% HEALTHY
        </span>
      </div>
      <div class="flex items-center space-x-2">
        <span class="text-slate-500">在线节点:</span>
        <span id="active-nodes-count" class="text-slate-200 font-bold">11 / 11 ONLINE</span>
      </div>
      <div class="flex items-center space-x-2">
        <span class="text-slate-500">同步时钟:</span>
        <span id="sync-timer" class="text-emerald-400 font-bold">15s</span>
      </div>
      <div class="flex items-center space-x-2">
        <span id="live-clock-badge" class="text-slate-500 font-mono">--:--:--</span>
      </div>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center space-x-2.5">
      <button id="refresh-btn" onclick="fetchData()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 transition flex items-center space-x-1.5 shadow-sm">
        <i class="fa-solid fa-arrows-rotate text-[11px]" id="refresh-icon"></i>
        <span>刷新</span>
      </button>

      <div id="auth-section" class="flex items-center">
        <button id="login-btn" onclick="toggleAuthModal()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition flex items-center space-x-1.5">
          <i class="fa-solid fa-shield-halved text-[11px]"></i>
          <span>控制台鉴权</span>
        </button>
        <div id="user-profile" class="hidden items-center space-x-2">
          <span id="user-email" class="text-xs text-emerald-400 font-mono font-bold"></span>
          <button onclick="handleLogout()" class="px-2 py-1 text-xs text-rose-400 hover:text-rose-300 font-mono">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER (SUPABASE WHITE LIGHT THEME 6-PANEL ACCORDION) -->
  <main class="flex-1 p-3 lg:p-4 overflow-hidden flex flex-col w-full max-w-[1920px] mx-auto">

    <!-- THE 6 MASTER FULL-SCREEN CURTAIN PANELS -->
    <div id="master-curtain-container" class="flex flex-col lg:flex-row gap-3 h-full transition-all duration-500 ease-out flex-1 overflow-hidden">

${overviewPanel}
${mapPanel}
${resourcePanel}
${latencyPanel}
${inventoryPanel}
${aiPanel}
    </div>
  </main>

${authModal}

  <!-- Dashboard browser modules are inlined by the Worker at render time. -->
  <script>
${dashboardCoreScript}
${dashboardInsightsScript}
${dashboardChartsScript}
${dashboardAuthScript}
  </script>
</body>
</html>
