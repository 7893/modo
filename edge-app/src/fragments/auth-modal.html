  <div id="auth-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 rounded-3xl p-6 max-w-md w-full border border-slate-700 relative shadow-2xl">
      <button onclick="toggleAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="text-center mb-6 space-y-1.5">
        <div class="inline-block p-3 rounded-2xl bg-emerald-950/60 border border-emerald-800 text-emerald-400 mb-1 shadow-sm">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
            <path d="M21.362 9.354H12V.343a.343.343 0 0 0-.583-.245L.15 11.597a.343.343 0 0 0 .245.584h9.362v9.011a.343.343 0 0 0 .583.245l11.267-11.499a.343.343 0 0 0-.245-.584z"/>
          </svg>
        </div>
        <h3 class="text-lg font-bold font-mono text-white">MODO COMMAND ACCESS</h3>
        <p class="text-xs text-slate-400">使用 Supabase 账号安全验证身份</p>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4 font-mono text-xs">
        <div>
          <label class="block text-slate-300 mb-1 font-semibold">邮箱地址</label>
          <input type="email" id="auth-email" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:bg-slate-900 transition" placeholder="admin@example.com">
        </div>
        <div>
          <label class="block text-slate-300 mb-1 font-semibold">登录密码</label>
          <input type="password" id="auth-password" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:bg-slate-900 transition" placeholder="••••••••">
        </div>

        <div id="auth-error" class="hidden p-2.5 rounded-lg bg-rose-950/80 border border-rose-800 text-rose-300 text-[11px]"></div>

        <button type="submit" id="auth-submit-btn" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold tracking-wider shadow-sm transition">
          立即登录
        </button>
      </form>
    </div>
  </div>
