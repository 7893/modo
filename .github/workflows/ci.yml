name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  source-policy:
    name: Source File Size Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce 400-line source limit
        run: python scripts/check_source_file_lines.py

  test-backend:
    name: Backend Unit Tests (Data Bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-bridge

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: data-bridge/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

  test-frontend:
    name: Frontend & Edge Worker Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Verify Wrangler Types & Build
        run: |
          pnpm build:css
          pnpm run cf-typegen
          pnpm run typecheck
          pnpm exec wrangler deploy --dry-run --outdir /tmp/modo-worker-dry-run
