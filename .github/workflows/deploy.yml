name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - 'edge-app/**'
      - 'data-bridge/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  deploy-edge:
    name: Deploy Edge Application
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    defaults:
      run:
        working-directory: edge-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --minify

  deploy-backend:
    name: Deploy Backend Services
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy to USA Node
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ubuntu/nexus
            git fetch origin main
            git reset --hard origin/main
            sudo systemctl restart modo-api.service || sudo systemctl restart nexus-api.service
            sudo systemctl restart modo-ingest.service || sudo systemctl restart nexus-ingest.service
