name: Deploy MODO

on:
  workflow_dispatch:
    inputs:
      deploy_edge:
        description: Deploy the Cloudflare Worker
        required: true
        default: false
        type: boolean
      deploy_backend:
        description: Deploy the backend service
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: modo-production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Run CI Checks
    uses: ./.github/workflows/ci.yml

  deploy-edge:
    name: Deploy Edge Application
    if: ${{ inputs.deploy_edge }}
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    defaults:
      run:
        working-directory: edge-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.6.0'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_BACKEND_URL: ${{ secrets.API_BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          TOPOLOGY_HUB_NODE: ${{ vars.TOPOLOGY_HUB_NODE }}
        run: |
          set -euo pipefail
          pnpm build:css
          deploy_args=(deploy --minify)
          if [ -n "$TOPOLOGY_HUB_NODE" ]; then
            deploy_args+=(--var "TOPOLOGY_HUB_NODE:$TOPOLOGY_HUB_NODE")
          fi
          pnpm exec wrangler "${deploy_args[@]}"
          # Store connection details as Worker secrets; never commit them.
          printf '%s' "$API_BACKEND_URL"     | pnpm exec wrangler secret put API_BACKEND_URL
          printf '%s' "$SUPABASE_URL"        | pnpm exec wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | pnpm exec wrangler secret put SUPABASE_PUBLISHABLE_KEY
          printf '%s' "$INTERNAL_API_SECRET" | pnpm exec wrangler secret put INTERNAL_API_SECRET

  deploy-backend:
    name: Deploy Backend Services
    if: ${{ inputs.deploy_backend }}
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy Artifacts to Backend Host
        env:
          TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
          TARGET_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          TARGET_USER="${TARGET_USER:-modo}"
          TARGET_PATH="${TARGET_PATH:-/opt/modo}"

          if [ -z "$TARGET_HOST" ] || [ -z "$TARGET_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "ERROR: DEPLOY_HOST, DEPLOY_SSH_KEY, and DEPLOY_KNOWN_HOSTS are required."
            exit 1
          fi
          if [[ ! "$TARGET_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || [[ "$TARGET_PATH" != /* ]] || [ "$TARGET_PATH" = "/" ]; then
            echo "ERROR: DEPLOY_USER or DEPLOY_PATH is invalid."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$TARGET_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 600 ~/.ssh/known_hosts

          echo "Syncing data-bridge code to the backend host..."
          rsync -avz -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='venv/' --exclude='.env' \
            data-bridge/src/ \
            "${TARGET_USER}@${TARGET_HOST}:${TARGET_PATH}/data-bridge/src/"

          rsync -avz -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            data-bridge/requirements.lock \
            "${TARGET_USER}@${TARGET_HOST}:${TARGET_PATH}/data-bridge/requirements.lock"

          echo "Restarting services and running the backend health probe..."
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${TARGET_USER}@${TARGET_HOST}" bash -s -- "$TARGET_PATH" <<'REMOTE'
            set -euo pipefail
            target_path="$1"
            if [ -f "$target_path/data-bridge/requirements.lock" ]; then
              "$target_path/data-bridge/venv/bin/pip" install -q --require-hashes -r "$target_path/data-bridge/requirements.lock"
            fi
            sudo systemctl restart modo.service
            sleep 3
            curl -sf http://127.0.0.1:8000/health || (echo 'modo-api health check failed' && exit 1)
          REMOTE
          echo "Backend deployment completed successfully."
